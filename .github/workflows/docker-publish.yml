name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test backend and frontend
        run: |
          python -m pip install -r requirements.txt pytest httpx
          bash -n deploy/install_docker.sh
          python -m pytest shopline_monitor/tests tests -q
          node --test shopline_monitor/tests/frontend.test.cjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sosove-dashboard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Compose container with synthetic data
        run: |
          mkdir -p secrets
          touch .env
          export DASHBOARD_ACCESS_TOKEN=ci-smoke-token
          export DASHBOARD_PORT=18000
          printf 'services:\n  dashboard:\n    image: sosove-dashboard:smoke\n' > /tmp/compose-smoke.yml
          docker compose -f docker-compose.yml -f /tmp/compose-smoke.yml config --quiet
          docker compose -f docker-compose.yml -f /tmp/compose-smoke.yml up -d --pull never
          python deploy/smoke_container.py
          docker compose -f docker-compose.yml -f /tmp/compose-smoke.yml exec -T dashboard python -c "import os; from pathlib import Path; assert os.getuid() == 10001; assert list(Path('/app/runtime/snapshots').glob('*.json')); assert not Path('/app/.env').exists(); assert not Path('/app/secrets/ga.json').exists()"
          docker compose -f docker-compose.yml -f /tmp/compose-smoke.yml restart dashboard
          python deploy/smoke_container.py
          docker compose -f docker-compose.yml -f /tmp/compose-smoke.yml down

      - name: Test one-command installer on Ubuntu
        run: |
          app_dir="/tmp/sosove-installer-ci-${GITHUB_RUN_ID}"
          sudo env SOSOVE_INSTALL_DIR="$app_dir" SOSOVE_INSTALL_NONINTERACTIVE=1 COMPOSE_PROJECT_NAME=sosove-installer-ci SHOPLINE_API_BASE_URL=https://example.myshopline.com SHOPLINE_ACCESS_TOKEN=ci-only-shopline-token DASHBOARD_ACCESS_TOKEN='ci-installer-password-$-literal' DASHBOARD_PORT=18001 DASHBOARD_BIND_IP=127.0.0.1 bash deploy/install_docker.sh
          before="$(sudo sha256sum "$app_dir/.env" | cut -d ' ' -f 1)"
          sudo env SOSOVE_INSTALL_DIR="$app_dir" SOSOVE_INSTALL_NONINTERACTIVE=1 COMPOSE_PROJECT_NAME=sosove-installer-ci bash deploy/install_docker.sh
          after="$(sudo sha256sum "$app_dir/.env" | cut -d ' ' -f 1)"
          test "$before" = "$after"
          curl -fsS http://127.0.0.1:18001/api/health
          curl -fsS -H 'Content-Type: application/json' --data '{"token":"ci-installer-password-$-literal"}' http://127.0.0.1:18001/api/auth/login
          sudo env COMPOSE_PROJECT_NAME=sosove-installer-ci docker compose --project-directory "$app_dir" -f "$app_dir/docker-compose.yml" -f "$app_dir/compose.build.yml" down

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository_owner }}/sosove-shopline-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/sosove-shopline-dashboard:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker compose logs --tail=80 || true
